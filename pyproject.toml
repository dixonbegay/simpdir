[project]
name = "simpdir"
version = "0.1.0"
description = "Simple and Important Managed Phone Directory - A phone directory that is LDAP compatible."
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "django>=5.2.15",
    "django-auth-ldap>=5.3.0",
    "django-environ>=0.14.0",
    "django-phonedir>=0.5.1",
    "python-ldap>=3.4.7",
]

[tool.uv]
package = false
default-groups = "all"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
